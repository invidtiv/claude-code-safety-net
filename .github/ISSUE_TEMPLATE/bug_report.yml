name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the reporting rules in [CONTRIBUTING.md](https://github.com/kenryu42/cc-safety-net/blob/main/CONTRIBUTING.md#reporting-a-bug). If a coding agent is writing this issue, point it at that file.

        A safe command that was blocked? Use the [False Positive](https://github.com/kenryu42/cc-safety-net/issues/new?template=false_positive.yml) form instead.

  - type: textarea
    id: report
    attributes:
      label: Report
      description: The problem, how to reproduce it, and the evidence (`explain` output, `doctor --json`, logs).
    validations:
      required: true
