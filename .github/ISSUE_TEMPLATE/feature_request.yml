name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the rules in [CONTRIBUTING.md](https://github.com/kenryu42/cc-safety-net/blob/main/CONTRIBUTING.md#requesting-a-feature). If a coding agent is writing this issue, point it at that file.

  - type: textarea
    id: request
    attributes:
      label: Request
      description: The problem you need to solve, the behavior you want, and a concrete example of where it would help.
    validations:
      required: true
